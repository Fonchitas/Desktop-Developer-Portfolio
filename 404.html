<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Alex Reyes Photography</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/glassmorphism.css">
  
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-lg);
      overflow: hidden;
    }
    
    .error-container {
      text-align: center;
      max-width: 600px;
    }
    
    .error-code {
      font-family: var(--font-display);
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: var(--fw-bold);
      line-height: 1;
      margin-bottom: var(--space-lg);
      background: linear-gradient(135deg, var(--accent), var(--text-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulse 2s ease-in-out infinite;
    }
    
    .error-title {
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      font-weight: var(--fw-bold);
      margin-bottom: var(--space-md);
      color: var(--text-primary);
    }
    
    .error-message {
      font-size: var(--text-lg);
      color: var(--text-secondary);
      margin-bottom: var(--space-2xl);
      line-height: 1.6;
    }
    
    .error-actions {
      display: flex;
      gap: var(--space-md);
      justify-content: center;
      flex-wrap: wrap;
    }
    
    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.6;
      }
    }
    
    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-20px);
      }
    }
    
    .error-container {
      animation: float 4s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-message">
      Looks like this page got lost in the infinite world. 
      Let's get you back to somewhere more interesting.
    </p>
    <div class="error-actions">
      <a href="index.html" class="glass-button">
        Return Home
      </a>
      <a href="index.html#work" class="glass-button">
        View Work
      </a>
    </div>
  </div>
</body>
</html>
